name: voz-neymar (temporario)
on:
  push:
    branches: [voz-neymar]
permissions:
  contents: write
  actions: read
jobs:
  copiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "tomadas-*", path: tomadas, merge-multiple: true, run-id: 41911345743, github-token: "${{ github.token }}" }
      - working-directory: tomadas
        run: |
          git init -q -b tomadas-neymar && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "tomadas"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" tomadas-neymar
