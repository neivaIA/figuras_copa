<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;background:#0b3d24;overflow:hidden}
svg{display:block;font-family:Inter,'Inter Display',sans-serif}
.b{font-weight:800}.m{font-weight:600}
</style></head><body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f5132"/><stop offset="1" stop-color="#082a19"/></linearGradient>
 <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="2" fill="#ffffff" opacity=".06"/></pattern>
 <filter id="glow"><feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#ffd84a" flood-opacity=".9"/></filter>
 <filter id="sh"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/></filter>
 <g id="ball">
  <circle r="50" fill="#fff" stroke="#1b1b1b" stroke-width="4"/>
  <path d="M0,-19 L18,-6 L11,15 L-11,15 L-18,-6Z" fill="#1b1b1b"/>
  <path d="M0,-19 L0,-48 M18,-6 L45,-15 M11,15 L28,40 M-11,15 L-28,40 M-18,-6 L-45,-15" stroke="#1b1b1b" stroke-width="4"/>
 </g>
 <g id="shirt"><path d="M-95,-120 L-35,-140 Q0,-110 35,-140 L95,-120 L150,-50 L105,-10 L80,-40 L80,140 L-80,140 L-80,-40 L-105,-10 L-150,-50Z"/></g>
 <g id="cup">
  <path d="M-40,-70 L40,-70 Q42,-10 0,10 Q-42,-10 -40,-70Z" stroke-width="4"/>
  <path d="M-40,-60 Q-70,-55 -60,-30 Q-52,-15 -32,-18 M40,-60 Q70,-55 60,-30 Q52,-15 32,-18" fill="none" stroke-width="8"/>
  <rect x="-8" y="8" width="16" height="30"/><rect x="-32" y="36" width="64" height="16" rx="4"/>
 </g>
 <g id="medal">
  <path d="M-30,-90 L-8,-20 L8,-20 L30,-90 L12,-90 L0,-50 L-12,-90Z" fill="#2fa35a"/>
  <circle cy="10" r="42" fill="#ffd84a" stroke="#b8860b" stroke-width="6"/>
  <path d="M0,-12 L7,4 L24,5 L11,16 L15,33 L0,24 L-15,33 L-11,16 L-24,5 L-7,4Z" fill="#b8860b"/>
 </g>
</defs>
<rect width="1080" height="1920" fill="url(#bg)"/>
<g opacity=".07" id="stripes"></g>
<rect width="1080" height="1920" fill="url(#dots)"/>
<g fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="6"><circle cx="540" cy="960" r="230"/><line x1="0" y1="960" x2="1080" y2="960"/></g>

<g id="topo" opacity="0">
 <rect x="290" y="70" width="500" height="64" rx="32" fill="#ffd84a"/>
 <text x="540" y="114" text-anchor="middle" font-size="34" class="b" fill="#0b3d24" letter-spacing="2">LENDAS EM NÚMEROS</text>
</g>

<!-- C1 gancho -->
<g id="c1">
 <text id="c1t" x="540" y="300" text-anchor="middle" font-size="76" class="b" fill="#fff">NEYMAR JR.</text>
 <text id="c1s" x="540" y="370" text-anchor="middle" font-size="44" class="m" fill="#ffd84a">gols na carreira</text>
 <g id="c1shirt" transform="translate(540,720)">
  <use href="#shirt" fill="#ffd84a" stroke="#1d7a3a" stroke-width="10" filter="url(#sh)"/>
  <text x="0" y="90" text-anchor="middle" font-size="200" class="b" fill="#1d4fa8">10</text>
 </g>
 <text id="c1n" x="540" y="1230" text-anchor="middle" font-size="280" class="b" fill="#fff" filter="url(#sh)">0</text>
 <text id="c1g" x="540" y="1330" text-anchor="middle" font-size="60" class="b" fill="#ffd84a">GOLS</text>
 <g id="c1mini"></g>
 <use id="c1ball" href="#ball"/>
</g>

<!-- C2 clubes -->
<g id="c2" opacity="0">
 <text x="540" y="300" text-anchor="middle" font-size="64" class="b" fill="#fff">Gols por clube</text>
 <text x="540" y="370" text-anchor="middle" font-size="42" class="m" fill="#ffd84a">jogos oficiais</text>
 <g id="c2rows"></g>
 <g id="c2ucl" opacity="0"><rect x="-200" y="-56" width="400" height="112" rx="24" fill="#fff" filter="url(#sh)"/>
  <use href="#cup" fill="#ffd84a" stroke="#b8860b" transform="translate(-140,8) scale(.7)"/>
  <text x="40" y="-6" text-anchor="middle" font-size="40" class="b" fill="#0b3d24">Champions</text>
  <text x="40" y="38" text-anchor="middle" font-size="34" class="m" fill="#1d7a3a">2014/15</text></g>
 <g id="c2fr" opacity="0"><rect x="-210" y="-50" width="420" height="100" rx="24" fill="#fff" filter="url(#sh)"/>
  <text x="0" y="16" text-anchor="middle" font-size="34" class="b" fill="#0d1b3e">5× Campeão Francês</text></g>
 <g id="c2notes"></g>
 <g id="c2money" opacity="0">
  <rect x="-420" y="-150" width="840" height="300" rx="36" fill="#0d1b3e" stroke="#ffd84a" stroke-width="6" filter="url(#sh)"/>
  <text id="c2m" x="0" y="20" text-anchor="middle" font-size="150" class="b" fill="#ffd84a">€ 0 mi</text>
  <text id="c2r" x="0" y="105" text-anchor="middle" font-size="36" class="b" fill="#fff" opacity="0">CONTRATAÇÃO MAIS CARA DA HISTÓRIA</text>
 </g>
</g>

<!-- C3 seleção -->
<g id="c3" opacity="0">
 <text x="540" y="300" text-anchor="middle" font-size="64" class="b" fill="#fff">Pela Seleção</text>
 <text x="540" y="370" text-anchor="middle" font-size="42" class="m" fill="#ffd84a">artilheiros · contagem da Fifa</text>
 <g id="c3bars"></g>
</g>

<!-- C4 títulos -->
<g id="c4" opacity="0">
 <text x="540" y="300" text-anchor="middle" font-size="64" class="b" fill="#fff">Principais títulos</text>
 <g id="c4cards"></g>
 <g id="c4wc" opacity="0">
  <rect x="140" y="1290" width="800" height="250" rx="40" fill="#ffffff" fill-opacity=".1" stroke="#fff" stroke-opacity=".5" stroke-width="4" stroke-dasharray="14 10"/>
  <use href="#cup" fill="#6b7f72" stroke="#4a5a50" transform="translate(280,1420) scale(1.1)"/>
  <text x="620" y="1400" text-anchor="middle" font-size="50" class="b" fill="#fff">Copa do Mundo</text>
  <text x="620" y="1470" text-anchor="middle" font-size="44" class="m" fill="#ffd84a">a que faltou</text>
 </g>
</g>

<!-- C5 CTA -->
<g id="c5" opacity="0">
 <g id="c5shirt" transform="translate(540,700)">
  <use href="#shirt" fill="#ffd84a" stroke="#1d7a3a" stroke-width="10" filter="url(#sh)"/>
  <text x="0" y="90" text-anchor="middle" font-size="200" class="b" fill="#1d4fa8">10</text>
 </g>
 <text x="540" y="380" text-anchor="middle" font-size="60" class="b" fill="#fff">E o próximo craque?</text>
 <g id="c5stats">
  <text x="240" y="1060" text-anchor="middle" font-size="96" class="b" fill="#fff">450+</text>
  <text x="240" y="1115" text-anchor="middle" font-size="36" class="m" fill="#ffd84a">gols</text>
  <text x="540" y="1060" text-anchor="middle" font-size="96" class="b" fill="#fff">4</text>
  <text x="540" y="1115" text-anchor="middle" font-size="36" class="m" fill="#ffd84a">clubes</text>
  <text x="840" y="1060" text-anchor="middle" font-size="96" class="b" fill="#fff">80</text>
  <text x="840" y="1115" text-anchor="middle" font-size="36" class="m" fill="#ffd84a">pela Seleção</text>
 </g>
 <g id="c5cta" opacity="0">
  <rect x="110" y="1240" width="860" height="320" rx="44" fill="#ffd84a" filter="url(#sh)"/>
  <text x="540" y="1340" text-anchor="middle" font-size="48" class="b" fill="#0b3d24">Comenta o próximo craque</text>
  <text x="540" y="1405" text-anchor="middle" font-size="40" class="m" fill="#0b3d24">e segue</text>
  <text x="540" y="1495" text-anchor="middle" font-size="72" class="b" fill="#0b3d24">@futebolizacao</text>
 </g>
</g>

<text x="540" y="1890" text-anchor="middle" font-size="24" class="m" fill="#fff" opacity=".55">Fontes: Fifa · Transfermarkt · Goal · imprensa esportiva (2026)</text>
</svg>
<script>
const NS="http://www.w3.org/2000/svg", $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), lin=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3), back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const el=(tag,at,par)=>{const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);par&&par.appendChild(e);return e};
const fmt=n=>Math.round(n).toLocaleString('pt-BR');
const win=(t,a,b,f=.3)=>Math.min(lin(t,a,a+f),1-lin(t,b-f,b));
let TL={n1:.5,n2:3.6,n3:7.6,n4:11.6,n5:16.2,n6:20.8,n7:24,n8:28.4,n9:32.2,n10:37,n11:40,n12:44.2,n13:49.5,n4b:14.2,n5m:19.6,n12b:46.8,fim:54.5};
window.setTL=o=>TL=o;
for(let i=0;i<10;i++) el('rect',{x:0,y:i*192,width:1080,height:96,fill:'#fff'},$('stripes'));
// mini camisas (c1)
const MC=[["#ffffff","#111"],["#a50044","#004d98"],["#0d1b3e","#d6203a"],["#1a4fbf","#fff"],["#ffd84a","#1d7a3a"]];
const minis=MC.map((c,i)=>{const g=el('g',{opacity:0},$('c1mini')); el('use',{href:'#shirt',fill:c[0],stroke:c[1],'stroke-width':14,transform:'scale(.42)'},g); return g});
// linhas de clubes
const CL=[["Santos","2009–13 · 2025–",150,"mais de 150","#ffffff","#111"],["Barcelona","2013–17",105,"105","#a50044","#004d98"],["PSG","2017–23",118,"118","#0d1b3e","#d6203a"],["Al-Hilal","2023–25",1,"1","#1a4fbf","#fff"]];
const rows=CL.map((c,i)=>{const y=540+i*300; const g=el('g',{transform:`translate(0,${y})`,opacity:0},$('c2rows'));
 el('use',{href:'#shirt',fill:c[4],stroke:c[5],'stroke-width':14,transform:'translate(150,40) scale(.5)'},g);
 el('text',{x:260,y:0,'font-size':50,class:'b',fill:'#fff'},g).textContent=c[0];
 el('text',{x:260,y:46,'font-size':32,class:'m',fill:'#ffd84a'},g).textContent=c[1];
 el('rect',{x:260,y:72,width:740,height:70,rx:16,fill:'#fff','fill-opacity':.08},g);
 const b=el('rect',{x:260,y:72,width:0,height:70,rx:16,fill:'#ffd84a'},g);
 const n=el('text',{x:0,y:124,'font-size':46,class:'b',fill:'#0b3d24'},g);
 return {g,b,n,v:c[2],lab:c[3],y}});
const notes=[...Array(26)].map((_,i)=>{const g=el('g',{opacity:0},$('c2notes'));
 el('rect',{x:-55,y:-28,width:110,height:56,rx:8,fill:'#3fae6a',stroke:'#1d6b3c','stroke-width':4},g);
 el('text',{x:0,y:13,'text-anchor':'middle','font-size':34,class:'b',fill:'#0d3d22'},g).textContent='€';
 return {g,x:80+((i*137)%920),d:i*.05,r:((i*53)%60)-30}});
// ranking seleção
const RK=[["Neymar",80],["Pelé",77],["Ronaldo",62],["Romário",55],["Zico",48]];
const bars=RK.map((r,i)=>{const g=el('g',{transform:`translate(0,${520+i*220})`},$('c3bars'));
 el('text',{x:90,y:-20,'font-size':48,class:'b',fill:i?'#fff':'#ffd84a'},g).textContent=r[0];
 el('rect',{x:90,y:0,width:900,height:110,rx:20,fill:'#fff','fill-opacity':.08},g);
 const b=el('rect',{x:90,y:0,width:0,height:110,rx:20,fill:i?'#2fa35a':'#ffd84a'},g);
 const n=el('text',{x:0,y:78,'font-size':64,class:'b',fill:i?'#fff':'#0b3d24','text-anchor':'end'},g);
 return {g,b,n,v:r[1]}});
// títulos
const TT=[["Libertadores","2011 · Santos","cup"],["Champions","2015 · Barcelona","cup"],["Mundial de Clubes","2015 · Barcelona","cup"],["Ouro olímpico","2016 · Seleção","medal"]];
const cards=TT.map((c,i)=>{const x=i%2?775:305, y=i<2?620:1010; const g=el('g',{opacity:0},$('c4cards'));
 el('rect',{x:-215,y:-170,width:430,height:340,rx:36,fill:'#fff',filter:'url(#sh)'},g);
 if(c[2]=='cup') el('use',{href:'#cup',fill:'#ffd84a',stroke:'#b8860b',transform:'translate(0,-50) scale(1.15)'},g);
 else el('use',{href:'#medal',transform:'translate(0,-40) scale(1.05)'},g);
 el('text',{x:0,y:85,'text-anchor':'middle','font-size':c[0].length>14?38:44,class:'b',fill:'#0b3d24'},g).textContent=c[0];
 el('text',{x:0,y:135,'text-anchor':'middle','font-size':32,class:'m',fill:'#1d7a3a'},g).textContent=c[1];
 return {g,x,y}});

function render(t){
 const T=TL;
 $('topo').setAttribute('opacity',lin(t,0,.5));
 // C1
 $('c1').setAttribute('opacity',win(t,0,T.n3-.1,.35));
 const k1=eo(lin(t,T.n1+.2,T.n1+.8)); $('c1t').setAttribute('opacity',k1); $('c1t').setAttribute('transform',`translate(0,${(1-k1)*30})`);
 $('c1s').setAttribute('opacity',eo(lin(t,T.n1+.5,T.n1+1.1)));
 const ks=back(lin(t,T.n1,T.n1+.8)); $('c1shirt').setAttribute('transform',`translate(540,${720-(1-ks)*90}) scale(${.6+.4*ks}) rotate(${Math.sin(t*2.2)*3})`);
 const cnt=450*eo(lin(t,T.n1+.6,T.n2+1.2)); $('c1n').textContent=(t>T.n2+1.2?'450+':fmt(cnt));
 $('c1n').setAttribute('fill',t>T.n2+1.2?'#ffd84a':'#fff');
 const pop=t>T.n2+1.2?1+.08*Math.max(0,1-(t-T.n2-1.2)/.4):1; $('c1n').setAttribute('transform',`translate(540,1140) scale(${pop}) translate(-540,-1140)`);
 minis.forEach((g,i)=>{const s=(T.n2b||T.n2+2.2)+i*.15, k=back(lin(t,s,s+.45)); g.setAttribute('opacity',clamp(k)); g.setAttribute('transform',`translate(${180+i*180},1500) scale(${Math.max(.01,k)*.9})`)});
 const bt=(t*1.6)%1; $('c1ball').setAttribute('transform',`translate(900,${1080-Math.abs(Math.sin(bt*Math.PI))*240}) rotate(${t*240}) scale(.85)`);
 $('c1ball').setAttribute('opacity',lin(t,T.n1+.8,T.n1+1.2)*(1-lin(t,(T.n2b||T.n2+2.2)-.3,(T.n2b||T.n2+2.2))));
 // C2
 $('c2').setAttribute('opacity',win(t,T.n3-.1,T.n9-.1,.35));
 const starts=[T.n3+.2,T.n4+.2,T.n7+.1,T.n8+.2];
 const km=back(lin(t,T.n5+.3,T.n5+.8)), kmo=1-lin(t,T.n7-.35,T.n7), mon=clamp(km)*kmo, dim=1-.78*mon;
 rows.forEach((r,i)=>{const s=starts[i], k=eo(lin(t,s,s+1.2)), ki=back(lin(t,s-.2,s+.3));
  r.g.setAttribute('opacity',clamp(ki)*dim); r.g.setAttribute('transform',`translate(${(1-clamp(ki))*-80},${r.y})`);
  const w=Math.max(70,700*r.v/150*k); r.b.setAttribute('width',k>0?w:0);
  r.n.textContent=r.lab.startsWith('mais')?(k>=1?'150+':fmt(150*k)):fmt(r.v*k);
  if(w>220){r.n.setAttribute('x',260+w-20);r.n.setAttribute('text-anchor','end');r.n.setAttribute('fill','#0b3d24')}
  else {r.n.setAttribute('x',260+w+20);r.n.setAttribute('text-anchor','start');r.n.setAttribute('fill','#fff')}
  if(i==0) r.b.setAttribute('fill','#ffffff'); if(i==1) r.b.setAttribute('fill','#c2185b'); if(i==2) r.b.setAttribute('fill','#4a6cf7'); if(i==3) r.b.setAttribute('fill','#7fb3ff');
  if(i==0&&k>0&&w>220) r.n.setAttribute('fill','#0b3d24'); if(i>0&&w>220) r.n.setAttribute('fill','#fff');
 });
 const ku=back(lin(t,T.n4b,T.n4b+.5)); $('c2ucl').setAttribute('opacity',clamp(ku)*dim);
 $('c2ucl').setAttribute('transform',`translate(790,${rows[1].y+5}) scale(${Math.max(.01,ku)*.85})`);
 const kf=back(lin(t,T.n7b||T.n7+2.4,(T.n7b||T.n7+2.4)+.5)); $('c2fr').setAttribute('opacity',clamp(kf));
 $('c2fr').setAttribute('transform',`translate(780,${rows[2].y+5}) scale(${Math.max(.01,kf)*.8})`);
 $('c2money').setAttribute('opacity',mon); $('c2money').setAttribute('transform',`translate(540,1060) scale(${Math.max(.01,km)})`);
 $('c2m').textContent='€ '+fmt(222*eo(lin(t,T.n5+.5,T.n5m)))+' mi';
 $('c2r').setAttribute('opacity',eo(lin(t,T.n6,T.n6+.5)));
 notes.forEach(n=>{const s=T.n5+.6+n.d, k=lin(t,s,s+1.6); n.g.setAttribute('opacity',(k>0&&k<1?1:0)*kmo);
  n.g.setAttribute('transform',`translate(${n.x+Math.sin(k*6+n.r)*40},${-80+k*1500}) rotate(${n.r+k*180})`)});
 // C3
 $('c3').setAttribute('opacity',win(t,T.n9-.1,T.n11-.1,.35));
 bars.forEach((b,i)=>{const st=T.n9+.6+(4-i)*.2, k=eo(lin(t,st,st+.9)); const w=820*b.v/80*k;
  b.b.setAttribute('width',w); b.n.textContent=fmt(b.v*k); b.n.setAttribute('x',90+w-20); b.g.setAttribute('opacity',lin(t,st-.2,st+.2));
  if(i==0) b.b.setAttribute('filter',t>T.n10?'url(#glow)':''); if(i==1) b.b.setAttribute('fill',t>T.n10?'#9fd9b4':'#2fa35a')});
 // C4
 $('c4').setAttribute('opacity',win(t,T.n11-.1,T.n13-.1,.35));
 const ts=[(T.n11a||T.n11+.9),(T.n11b||T.n11+1.9),(T.n11c||T.n11+2.9),T.n12+.3];
 cards.forEach((c,i)=>{const k=back(lin(t,ts[i],ts[i]+.5)); c.g.setAttribute('opacity',clamp(k)); c.g.setAttribute('transform',`translate(${c.x},${c.y}) scale(${Math.max(.01,k)})`)});
 const kw=eo(lin(t,T.n12b,T.n12b+.6)); $('c4wc').setAttribute('opacity',kw); $('c4wc').setAttribute('transform',`translate(0,${(1-kw)*40})`);
 // C5
 $('c5').setAttribute('opacity',win(t,T.n13-.1,T.fim+1,.35)*(1-lin(t,T.fim-.5,T.fim)));
 const k5=back(lin(t,T.n13,T.n13+.7)); $('c5shirt').setAttribute('transform',`translate(540,700) scale(${.5+.5*clamp(k5,0,1.2)}) rotate(${Math.sin(t*1.8)*2.5})`);
 $('c5stats').setAttribute('opacity',eo(lin(t,T.n13+.4,T.n13+.9)));
 const kc=back(lin(t,T.n13+.8,T.n13+1.4)); $('c5cta').setAttribute('opacity',clamp(kc));
 $('c5cta').setAttribute('transform',`translate(540,1400) scale(${Math.max(.01,kc)}) translate(-540,-1400)`);
}
window.render=render; render(0);
</script></body></html>
